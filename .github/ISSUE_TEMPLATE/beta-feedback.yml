name: Beta feedback
description: Report a reproducible Waing beta problem
title: "[Beta]: "
labels: ["beta"]
body:
  - type: textarea
    id: reproduction
    attributes: { label: Reproduction steps, description: Do not include secrets or private source., placeholder: "1. Open…\n2. Select…\n3. Run…" }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: Actual behavior }
    validations: { required: true }
  - type: input
    id: environment
    attributes: { label: Environment, placeholder: "Waing 0.1.0, macOS 15, Codex 0.145.x" }
    validations: { required: true }
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed attachments and removed source, credentials, and personal data.
          required: true
